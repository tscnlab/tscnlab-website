---
layout: default
---

<div id="top"></div>

<article class="news-article shell">
  <header class="news-article-header">
    <time
      class="news-article-date"
      datetime="{{ page.date | date_to_xmlschema }}"
    >
      {{ page.date | date: "%b %-d" }}
    </time>

    <h1>{{ page.title }}</h1>

    {% if page.author %}
      <p class="news-article-author">
        Written By {{ page.author }}
      </p>
    {% endif %}
  </header>

  <div class="news-article-content">
    {{ content }}
  </div>

  <nav class="news-article-nav" aria-label="News navigation">
    <div class="news-nav-item news-nav-previous">
      {% if page.previous %}
        <span>Previous</span>

        <a href="{{ page.previous.url | relative_url }}">
          {{ page.previous.title }}
        </a>
      {% endif %}
    </div>

    <div class="news-nav-item news-nav-next">
      {% if page.next %}
        <span>Next</span>

        <a href="{{ page.next.url | relative_url }}">
          {{ page.next.title }}
        </a>
      {% endif %}
    </div>
  </nav>
</article>
