---
layout: default
---
<article class="article shell narrow">
  {% if page.image %}<img class="member-detail-image" src="{{ page.image | relative_url }}" alt="{{ page.name }}">{% endif %}
  <p class="eyebrow">{{ page.role }}</p>
  <h1>{{ page.name }}</h1>
  <div class="prose">{{ content }}</div>
</article>
