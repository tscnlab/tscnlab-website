title: "Light O’Clock"
subtitle: "A podcast on light and your body clock"
tagline: "We break down the science behind circadian rhythms so you can be enlightened."
description: "In each podcast episode, we chat with experts in the field about a variety of topics, spanning from the effects of light on our biology and how it can be used for the treatment of psychiatric disorders and beyond."
