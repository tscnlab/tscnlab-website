name: Sync podcast

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
      timezone: 'Europe/Berlin'

permissions:
  contents: write
  actions: write

concurrency:
  group: podcast-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Refresh episode catalog
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: python3 scripts/sync_podcast.py

      - name: Publish catalog changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          catalog=_data/podcast_episodes.json
          if git diff --quiet -- "$catalog"; then
            echo "Podcast catalog is up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$catalog"
          git commit -m "Update Light O’Clock episode catalog"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
